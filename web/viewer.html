<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Viewer</title>
  <style>
    :root { color-scheme: dark; --bg:#14161b; --panel:#1d2027; --line:#2c303a; --fg:#d8dce6; --dim:#8a91a2; --acc:#ffb340; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, sans-serif; overflow:hidden; }
    #app { display:grid; grid-template-columns:230px 1fr 300px; height:100%; }
    aside { background:var(--panel); display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
    #info { border-right:0; border-left:1px solid var(--line); overflow:auto; padding:10px; }
    .hd { padding:8px; border-bottom:1px solid var(--line); }
    input[type=text], select { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:5px 7px; font:inherit; }
    #cats { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
    button { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font:inherit; cursor:pointer; }
    button:hover { border-color:var(--dim); }
    button.on { background:var(--acc); color:#111; border-color:var(--acc); }
    #list { list-style:none; margin:0; padding:0; overflow:auto; flex:1; }
    #list li { padding:3px 10px; display:flex; justify-content:space-between; cursor:pointer; font-variant-numeric:tabular-nums; }
    #list li:hover { background:#262a33; }
    #list li.sel { background:#35291a; color:var(--acc); }
    #list li small { color:var(--dim); }
    #count { padding:5px 10px; color:var(--dim); border-top:1px solid var(--line); }
    main { display:flex; flex-direction:column; min-width:0; min-height:0; }
    #bar { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; padding:6px 8px; background:var(--panel); border-bottom:1px solid var(--line); }
    #bar .grp { display:flex; gap:4px; align-items:center; }
    #bar label { color:var(--dim); display:flex; gap:4px; align-items:center; cursor:pointer; }
    #bar select { width:auto; max-width:280px; }
    #stage { position:relative; flex:1; min-height:0; }
    canvas#c { position:absolute; inset:0; width:100%; height:100%; display:block; }
    #sheet { position:absolute; inset:0; overflow:auto; padding:8px; display:grid; grid-template-columns:repeat(auto-fill,128px); gap:6px; align-content:start; background:var(--bg); }
    #sheet[hidden] { display:none; }
    .cell { width:128px; height:144px; background:var(--panel); border:1px solid var(--line); border-radius:4px; cursor:pointer; position:relative; overflow:hidden; }
    .cell:hover { border-color:var(--acc); }
    .cell canvas { width:128px; height:128px; display:block; image-rendering:pixelated; }
    .cell span { position:absolute; bottom:0; left:0; right:0; text-align:center; font-size:11px; background:#0008; padding:1px 0; }
    .cell.empty canvas { opacity:.2; }
    #overlay { position:absolute; left:8px; bottom:8px; right:8px; display:flex; gap:8px; align-items:center; pointer-events:none; }
    #overlay > * { pointer-events:auto; }
    #anim { background:#000a; padding:6px 8px; border-radius:6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    #anim select { width:auto; max-width:260px; }
    #status { position:absolute; top:8px; left:8px; background:#000a; padding:3px 8px; border-radius:4px; color:var(--dim); pointer-events:none; }
    #status.err { color:#ff7070; }
    h3 { margin:0 0 6px; font-size:15px; } h4 { margin:12px 0 4px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
    dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:0; } dt { color:var(--dim); } dd { margin:0; }
    .tex { display:inline-flex; flex-direction:column; align-items:center; margin:0 4px 4px 0; font-size:10px; color:var(--dim); }
    .tex img { width:40px; height:40px; image-rendering:pixelated; background:repeating-conic-gradient(#333 0 25%, #222 0 50%) 0 0/8px 8px; }
    .warn { color:#ffb347; } .dim { color:var(--dim); }
    .gm { display:flex; gap:6px; align-items:center; padding:1px 0; cursor:pointer; } .gm:hover { color:var(--acc); }
    kbd { background:var(--bg); border:1px solid var(--line); border-radius:3px; padding:0 4px; }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <div class="hd">
        <input id="q" type="text" placeholder="number, e.g. 774 or 774-800" autocomplete="off" />
        <div id="cats"></div>
      </div>
      <ul id="list"></ul>
      <div id="count"></div>
    </aside>
    <main>
      <div id="bar">
        <div class="grp" id="modes"></div>
        <div class="grp" id="grpctl" hidden>
          <select id="grpsel"></select>
          <label><input type="checkbox" id="spread" /> spread</label>
        </div>
        <label title="affine texture mapping + vertex snapping"><input type="checkbox" id="wobble" /> PS1 wobble</label>
        <label><input type="checkbox" id="vcol" checked /> vertex colour</label>
        <label><input type="checkbox" id="tex" checked /> textures</label>
        <label><input type="checkbox" id="wire" /> wireframe</label>
        <label><input type="checkbox" id="grid" checked /> grid</label>
        <span class="dim"><kbd>&uarr;</kbd><kbd>&darr;</kbd> step, <kbd>space</kbd> play</span>
      </div>
      <div id="stage">
        <canvas id="c"></canvas>
        <div id="sheet" hidden></div>
        <div id="status"></div>
        <div id="overlay"><div id="anim" hidden></div></div>
      </div>
    </main>
    <aside id="info"></aside>
  </div>
  <script type="module" src="./client/viewer.ts"></script>
</body>
</html>
